schemaVersion: 1
issue: 4
title: "Profile and GitHub connection surface"
objective: >-
  Move profile and linked GitHub connection behavior onto the canonical identity
  model and transport so account screens use typed responses, consistent errors,
  and existing admin UI conventions.
scope:
  - API profile and connection identity contracts and presentation boundary
  - Admin server profile loading and typed browser mutations
  - Account/profile loading, empty/error/retry, and mutation feedback states
  - Regression tests for identity, adapter, contract, and admin flow
out_of_scope:
  - Changing account navigation mode or AdminShell structure
  - Adding external providers beyond the supported GitHub connection
  - Organization-scoped profile or connection resources
  - Reading or modifying environment/credential files
acceptance_criteria:
  - Profile reads and mutations use standard success/error contracts and runtime-validated admin schemas.
  - connections is the single external identity source for the supported GitHub provider.
  - Account screens do not issue raw application-data fetches or choose scope from localStorage.
  - Loading, empty, error, retry, and mutation feedback states are covered without changing existing account navigation mode.
  - Identity, adapter, contract, and admin tests cover the complete profile/connection flow.
constraints:
  - Preserve repository and subdirectory AGENTS.md rules.
  - Keep API authorization and persistence in apps/api; admin remains an API client.
  - Use kebab-case for new API files and local Zod validation at API boundaries.
  - Do not modify environment or credential files.
required_checks:
  - pnpm --filter @project-forge/api test
  - pnpm --filter @project-forge/admin lint
  - pnpm --filter @project-forge/admin typecheck
  - pnpm --filter @project-forge/admin check:admin-client-boundary
  - pnpm --filter @project-forge/admin test -- --run
  - pnpm run check
  - pnpm run build
assigned_profile: programmer
branch: issue/4-profile-github-connection-surface
worktree: E:/Projects/project-forge-issue-4
status: ready-for-review
