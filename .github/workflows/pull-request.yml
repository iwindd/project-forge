name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    name: Verify pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: API lint
        run: pnpm --filter @project-forge/api lint

      - name: API test
        run: pnpm --filter @project-forge/api test

      - name: API typecheck
        run: pnpm --filter @project-forge/api check-types

      - name: API build
        run: pnpm --filter @project-forge/api build

      - name: Admin lint
        run: pnpm --filter @project-forge/admin lint

      - name: Admin test
        run: pnpm --filter @project-forge/admin test

      - name: Admin typecheck
        run: pnpm --filter @project-forge/admin typecheck

      - name: Admin client-boundary check
        run: pnpm --filter @project-forge/admin check:admin-client-boundary

      - name: Admin UI i18n check
        run: pnpm --filter @project-forge/admin check:ui-i18n

      - name: Admin build
        run: pnpm --filter @project-forge/admin build
